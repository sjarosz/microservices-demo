# Identity for Online Boutique behind a Backend for Frontend: see docs/identity.md.
# Adds bff, customerservice and their Redis, and points the frontend at the BFF's signed context.
# The overlay that uses this component supplies:
#   - Secret identity-secrets: BFF_CONTEXT_KEY, INTERNAL_API_TOKEN, VAULT_KEY, OIDC_CLIENT_SECRET
#   - the values of ConfigMap identity-config (PUBLIC_URL, OIDC_ISSUER, ...), by patch
#   - a route from the outside to Service bff (instead of frontend / frontend-external)
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- identity.yaml
patches:
- path: frontend.patch.yaml
