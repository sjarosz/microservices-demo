# A throwaway OpenID Connect provider for the identity component: Keycloak in development mode with one realm
# ("boutique"), self-registration on, the BFF's client and a demo user. Use it until a real provider is wired in
# (then drop this component and change identity-config). Not for production.
# The overlay supplies:
#   - Secret identity-secrets, additionally with IDP_ADMIN_PASSWORD and DEMO_USER_PASSWORD
#   - IDP_URL in ConfigMap identity-config: how browsers reach Keycloak
#   - a route from the outside to Service identity-dev-idp, paths /realms/ and /resources/ only
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- keycloak.yaml
configMapGenerator:
- name: identity-dev-idp-realm
  files:
  - realm.json
